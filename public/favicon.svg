<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .cairn-base { fill: #18181B; }
    .cairn-mid { fill: #27272A; }
    .cairn-top { fill: #2563EB; }
    @media (prefers-color-scheme: dark) {
      .cairn-base { fill: #E4E4E7; }
      .cairn-mid { fill: #FAFAFA; }
      .cairn-top { fill: #3B82F6; }
    }
  </style>
  <!-- Top balancing stone (electric blue accent) -->
  <rect class="cairn-top" x="23" y="10" width="18" height="10" rx="4" />
  <!-- Middle stone -->
  <rect class="cairn-mid" x="16" y="24" width="32" height="12" rx="5" />
  <!-- Base foundation stone -->
  <rect class="cairn-base" x="9" y="40" width="46" height="14" rx="6" />
</svg>
